name: CI

# The Hostinger build skips lint and type checks to save resources, so they run here instead.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          TOKIO_WORKER_THREADS: "1"
          RAYON_NUM_THREADS: "1"
